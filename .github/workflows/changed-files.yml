name: Detect relevant changes

on:
  workflow_call:
    outputs:
      preview:
        value: ${{ jobs.changes.outputs.preview }}
      typecheck:
        value: ${{ jobs.changes.outputs.typecheck }}
      lint:
        value: ${{ jobs.changes.outputs.lint }}
      format:
        value: ${{ jobs.changes.outputs.format }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      preview: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.preview == 'true' || steps.filter.outputs.preview_workflow == 'true' }}
      typecheck: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.typecheck == 'true' || steps.filter.outputs.toolchain == 'true' || steps.filter.outputs.quality_config == 'true' }}
      lint: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lint == 'true' || steps.filter.outputs.toolchain == 'true' || steps.filter.outputs.quality_config == 'true' }}
      format: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.format == 'true' || steps.filter.outputs.format_config == 'true' || steps.filter.outputs.toolchain == 'true' || steps.filter.outputs.quality_config == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          # PRs use the complete PR diff via the API (including fork PRs).
          # For main pushes, compare to the pre-push SHA, not just HEAD~1.
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: .github/ci-paths.yml
