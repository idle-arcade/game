name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changed-files.yml

  typecheck:
    name: npm run typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate Prisma types
        run: npm run db:generate
      - run: npm run typecheck

  lint:
    name: npm run lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: npm run format:check
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  summary:
    name: Code quality summary
    needs: [changes, typecheck, lint, format]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize all checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TYPECHECK_REQUIRED: ${{ needs.changes.outputs.typecheck }}
          LINT_REQUIRED: ${{ needs.changes.outputs.lint }}
          FORMAT_REQUIRED: ${{ needs.changes.outputs.format }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
        run: |
          {
            echo '## Code quality'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| Change detection | %s |\n' "$CHANGES_RESULT"
            printf '| npm run typecheck | %s |\n' "$TYPECHECK_RESULT"
            printf '| npm run lint | %s |\n' "$LINT_RESULT"
            printf '| npm run format:check | %s |\n' "$FORMAT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHANGES_RESULT" == success ]] &&
          [[ "$TYPECHECK_RESULT" == success || ( "$TYPECHECK_REQUIRED" == false && "$TYPECHECK_RESULT" == skipped ) ]] &&
          [[ "$LINT_RESULT" == success || ( "$LINT_REQUIRED" == false && "$LINT_RESULT" == skipped ) ]] &&
          [[ "$FORMAT_RESULT" == success || ( "$FORMAT_REQUIRED" == false && "$FORMAT_RESULT" == skipped ) ]]
