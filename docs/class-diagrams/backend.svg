<text x="50" y="56.0" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#203047">Authentication structure</text>
<text x="74" y="197.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="74" y="219.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">trpc/init</text>
<text x="74" y="258.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">publicProcedure: procedure builder</text>
<text x="74" y="278.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">protectedProcedure: auth required</text>
<text x="74" y="328.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">createContext(opts): Promise&lt;Context&gt;</text>
<text x="654" y="197.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="654" y="219.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">authRouter</text>
<text x="654" y="258.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">registerLimit: middleware</text>
<text x="654" y="278.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">loginLimit: middleware</text>
<text x="654" y="328.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">register(credentials): public user</text>
<text x="654" y="348.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">login(credentials): public user</text>
<text x="654" y="369.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">logout(): { success: true }</text>
<text x="654" y="390.4" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">me(): public user | null</text>
<text x="1254" y="197.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«external»</text>
<text x="1254" y="219.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">Better Auth</text>
<text x="1254" y="258.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">database: Prisma adapter</text>
<text x="1254" y="278.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">plugins: username</text>
<text x="1254" y="328.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">api.signUpEmail(...)</text>
<text x="1254" y="348.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">api.signInUsername(...)</text>
<text x="1254" y="369.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">api.signOut(...)</text>
<text x="1254" y="390.4" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">api.getSession(...)</text>
<text x="74" y="597.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="74" y="619.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">rateLimit</text>
<text x="74" y="658.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">windows: Map&lt;IP, Window&gt;</text>
<text x="74" y="678.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">Window: { count, resetAt }</text>
<text x="74" y="728.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">rateLimit(options): middleware</text>
<text x="654" y="597.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="654" y="619.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">auth schemas</text>
<text x="654" y="658.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">credentialsSchema: Zod object</text>
<text x="654" y="678.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">loginSchema: Zod object</text>
<text x="654" y="699.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">usernameSchema, passwordSchema</text>
<text x="654" y="720.4" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">Credentials: inferred type</text>
<text x="1254" y="597.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="1254" y="619.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">auth glue</text>
<text x="1254" y="658.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">placeholderEmail(username): string</text>
<text x="1254" y="678.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">forwardAuthHeaders(res, headers): void</text>
<text x="1254" y="699.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">toTRPCError(error): TRPCError</text>
<text x="1254" y="720.4" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">toLoginTRPCError(error): TRPCError</text>
<text x="74" y="897.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«type»</text>
<text x="74" y="919.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">Context</text>
<text x="74" y="958.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">req: Express request</text>
<text x="74" y="978.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">res: Express response</text>
<text x="74" y="999.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">session: session | null</text>
<text x="74" y="1020.4" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">user: auth user | null</text>
<text x="654" y="897.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«modules»</text>
<text x="654" y="919.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">Express / appRouter</text>
<text x="654" y="958.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">appRouter: { auth, health }</text>
<text x="654" y="978.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">AppRouter = typeof appRouter</text>
<text x="654" y="1028.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">createApp(): Express app</text>
<text x="1254" y="897.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="1254" y="919.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">db</text>
<text x="1254" y="958.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">prisma: PrismaClient</text>
<text x="1254" y="978.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">adapter: PrismaMariaDb</text>
