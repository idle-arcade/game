<text x="50" y="56.0" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#203047">Authentication structure</text>
<text x="74" y="167.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«component»</text>
<text x="74" y="189.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">EntryScreen</text>
<text x="74" y="228.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">EntryScreen(): JSX</text>
<text x="524" y="167.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«hook»</text>
<text x="524" y="189.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">useEntryForm</text>
<text x="524" y="228.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">values: Credentials</text>
<text x="524" y="248.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">fieldErrors: FieldErrors</text>
<text x="524" y="269.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">formError: AuthErrorKey | null</text>
<text x="524" y="290.4" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">pending: boolean</text>
<text x="524" y="344.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">setValue(field, value): void</text>
<text x="524" y="364.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">login(): void</text>
<text x="524" y="385.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">register(): void</text>
<text x="74" y="457.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«component»</text>
<text x="74" y="479.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">EntryForm</text>
<text x="74" y="518.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">props: EntryFormProps</text>
<text x="74" y="565.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">EntryForm(props): JSX</text>
<text x="74" y="727.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«type»</text>
<text x="74" y="749.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">EntryFormProps</text>
<text x="74" y="788.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">values: Credentials</text>
<text x="74" y="808.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">fieldErrors: FieldErrors</text>
<text x="74" y="829.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">formError: AuthErrorKey | null</text>
<text x="74" y="850.4" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">pending: boolean</text>
<text x="74" y="871.2" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">onChange(field, value): void</text>
<text x="74" y="892.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">onLogin(), onRegister(): void</text>
<text x="524" y="527.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="524" y="549.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">validation</text>
<text x="524" y="588.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">FieldErrors: partial error record</text>
<text x="524" y="635.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">validateLogin(values): FieldErrors</text>
<text x="524" y="655.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">validateRegistration(values): FieldErrors</text>
<text x="1124" y="527.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«type»</text>
<text x="1124" y="549.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">Credentials</text>
<text x="1124" y="588.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">username: string</text>
<text x="1124" y="608.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">password: string</text>
<text x="1124" y="167.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«module»</text>
<text x="1124" y="189.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">trpc</text>
<text x="1124" y="228.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">trpc: API query options</text>
<text x="1124" y="248.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">queryClient: QueryClient</text>
<text x="1124" y="817.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«external»</text>
<text x="1124" y="839.1" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">QueryClient</text>
<text x="1124" y="878.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">clear(): void</text>
<text x="1124" y="898.8" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#203047">setQueryData(key, user): void</text>
<text x="524" y="817.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203047">«type»</text>
